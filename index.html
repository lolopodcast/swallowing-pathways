/* ===== Animation engine ===== */
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function mkPath(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const L = cum[cum.length-1];
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
    d += ` Q${pts[i][0]},${pts[i][1]} ${mx},${my}`;
  }
  const last = pts[pts.length-1]; d += ` L${last[0]},${last[1]}`;
  const at = (f) => {
    const s = clamp01(f) * L; let i = 1;
    while (i < cum.length - 1 && cum[i] < s) i++;
    const k = (s - cum[i-1]) / ((cum[i] - cum[i-1]) || 1);
    return [lerp(pts[i-1][0], pts[i][0], k), lerp(pts[i-1][1], pts[i][1], k)];
  };
  return { d, at };
}
const FOOD = mkPath([[140,250],[180,238],[220,232],[252,240],[272,262],[285,285],[296,315],[300,345],[301,375],[301,420],[301,470],[301,540]]);
const ASP  = mkPath([[140,250],[180,238],[220,232],[252,240],[272,262],[285,285],[296,315],[280,340],[264,362],[259,392],[259,440],[259,490]]);
const AIR  = mkPath([[84,206],[120,184],[180,170],[248,168],[290,186],[302,226],[300,268],[292,300],[278,328],[262,352],[259,392],[259,460],[259,545]]);

const REST = { tongue:0, soft:0, larynx:0, epi:0, vocal:0, ues:0, f:0, bolus:false, apnea:false, phase:'rest', peri:false, cough:false, inTrachea:false, kind:'swallow' };

const swallowState = (t) => {
  const back = ramp(t, 0.55, 0.66);
  const s = {
    tongue: ramp(t,0.05,0.18) - ramp(t,0.3,0.42),
    soft: ramp(t,0.2,0.29) - back,
    larynx: ramp(t,0.26,0.34) - back,
    epi: ramp(t,0.29,0.38) - back,
    vocal: ramp(t,0.24,0.3) - ramp(t,0.57,0.66),
    ues: ramp(t,0.38,0.44) - ramp(t,0.54,0.6),
  };
  let f;
  if (t < 0.05) f = 0;
  else if (t < 0.25) f = lerp(0, 0.27, (t-0.05)/0.2);
  else if (t < 0.55) f = lerp(0.27, 0.65, (t-0.25)/0.3);
  else f = lerp(0.65, 1, Math.min(1, (t-0.55)/0.4));
  const phase = t < 0.25 ? 'oral' : t < 0.55 ? 'pharyngeal' : 'esophageal';
  return { ...s, f, bolus: t < 0.97, apnea: s.vocal > 0.5, phase, peri: phase === 'esophageal' && t < 0.95, cough:false, inTrachea:false, kind:'swallow' };
};
const aspState = (t) => {
  const back = ramp(t, 0.86, 0.94);
  const s = {
    tongue: ramp(t,0.05,0.18) - ramp(t,0.3,0.42),
    soft: ramp(t,0.2,0.29) - back,
    larynx: ramp(t,0.58,0.68) - back,
    epi: ramp(t,0.6,0.7) - back,
    vocal: ramp(t,0.55,0.62) - ramp(t,0.68,0.72),
    ues: 0,
  };
  let f;
  if (t < 0.05) f = 0;
  else if (t < 0.25) f = lerp(0, 0.296, (t-0.05)/0.2);
  else if (t < 0.6) f = lerp(0.296, 1, (t-0.25)/0.35);
  else if (t < 0.7) f = 1;
  else f = lerp(1, 0.62, ramp(t,0.7,0.85));
  const phase = t < 0.25 ? 'oral' : t < 0.7 ? 'aspiration' : 'cough';
  return { ...s, f, bolus: t < 0.97, apnea:false, phase, peri:false, cough: t >= 0.7 && t < 0.9, inTrachea: t > 0.5 && t < 0.9, kind:'asp' };
};

const MODES = {
  anatomy:    { kind:'static' },
  breath:     { kind:'breath', dur:4 },
  oral:       { kind:'swallow', range:[0,0.27], dur:3.2 },
  pharyngeal: { kind:'swallow', range:[0.2,0.62], dur:3.6 },
  esophageal: { kind:'swallow', range:[0.5,1], dur:4.5 },
  full:       { kind:'swallow', range:[0,1], dur:9 },
  aspiration: { kind:'asp', range:[0,1], dur:9 },
};
const stateFor = (mode, u) => {
  const m = MODES[mode];
  if (m.kind === 'swallow') return swallowState(lerp(m.range[0], m.range[1], u));
  if (m.kind === 'asp') return aspState(lerp(m.range[0], m.range[1], u));
  if (m.kind === 'breath') return { ...REST, phase:'breath', kind:'breath' };
  return { ...REST };
};

const reduceMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };

function useAnimLoop(dur, active = true) {
  const [u, setU] = useState(0);
  const [playing, setPlaying] = useState(() => active && !reduceMotion());
  const [speed, setSpeed] = useState(1);
  const ref = useRef({ u: 0, hold: 0, last: 0 });
  useEffect(() => {
    if (!playing || !dur) return;
    let raf;
    ref.current.last = performance.now();
    const step = (now) => {
      const dt = Math.min(0.1, (now - ref.current.last) / 1000); ref.current.last = now;
      const r = ref.current;
      if (r.hold > 0) { r.hold -= dt; if (r.hold <= 0) { r.u = 0; } }
      else { r.u += dt * speed / dur; if (r.u >= 1) { r.u = 1; r.hold = 1.0; } }
      setU(r.u);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [playing, speed, dur]);
  const seek = (v) => { ref.current.u = v; ref.current.hold = 0; setU(v); };
  return { u, playing, setPlaying, speed, setSpeed, seek };
}

/* ===== Original sagittal head & neck SVG ===== */
const LABELS = [

const SwallowSVG = ({ mode, u, lang, active, setActive, compact = false, breathU = 0 }) => {
  const s = stateFor(mode, u);

  const shake = s.cough ? Math.sin(u * 900) * 2.2 : 0;
  const uesRx = 17 - 12 * s.ues;
  const vb = compact ? "60 100 350 460" : "0 0 640 560";
  const showFoodPath = ['oral','pharyngeal','esophageal','full','anatomy'].includes(mode);
  const showAirPath = mode === 'breath' || mode === 'anatomy';
  const airDots = mode === 'breath' ? [0, 1/3, 2/3].map(k => AIR.at((breathU + k) % 1)) : [];
  const pick = (id) => setActive && setActive(active === id ? null : id);

    <svg viewBox={vb} className="w-full h-auto block" draggable="false" role="img"
      aria-label={lang === 'zh' ? '頭頸部矢狀切面吞嚥示意動畫' : 'Animated sagittal section of the head and neck during swallowing'}>

        {/* spine */}

const PhasePill = ({ s, t, mode }) => {
  const key = s.phase === 'rest' ? (mode === 'anatomy' ? 'phase_anatomy' : 'phase_rest') : `phase_${s.phase}`;
  const tone = s.phase === 'aspiration' || s.phase === 'cough' ? 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300' : 'bg-[#004030]/10 text-[#004030] dark:bg-[#D8C3A5]/15 dark:text-[#D8C3A5]';
  return (
    <div className="flex flex-wrap items-center gap-2 text-sm">
      <span className={`px-3 py-1 rounded-full font-bold ${tone}`}>{t[key]}</span>
      {s.apnea && <span className="px-3 py-1 rounded-full font-semibold bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-200">{t.apnea}</span>}
      {s.cough && <span className="px-3 py-1 rounded-full font-semibold bg-red-600 text-white">{t.cough_alert}</span>}
    </div>
  );
};

const PlayerControls = ({ loop, t }) => (
  <div className="flex flex-wrap items-center gap-2 mt-3">
    <button onClick={() => loop.setPlaying(!loop.playing)} aria-label={loop.playing ? t.ctrl_pause : t.ctrl_play}
      className="flex items-center gap-1 px-3 py-2 rounded-lg bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] text-sm font-bold">
      {loop.playing ? <IconPause size={16}/> : <IconPlay size={16}/>}{loop.playing ? t.ctrl_pause : t.ctrl_play}
    </button>
    <button onClick={() => { loop.seek(0); loop.setPlaying(true); }} className="flex items-center gap-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 text-sm hover:bg-slate-100 dark:hover:bg-slate-700">
      <IconRestart size={16}/>{t.ctrl_restart}
    </button>
    <div className="flex items-center gap-1 text-sm" role="group" aria-label={t.ctrl_speed}>
      <span className="text-slate-500 mr-1">{t.ctrl_speed}</span>
      {[1, 0.5, 0.25].map(v => (
        <button key={v} onClick={() => loop.setSpeed(v)} className={`px-2 py-1 rounded-md border text-xs font-bold ${loop.speed === v ? 'bg-[#004030] text-white border-[#004030] dark:bg-[#D8C3A5] dark:text-[#004030] dark:border-[#D8C3A5]' : 'border-slate-300 dark:border-slate-600'}`}>{v}×</button>
      ))}
    </div>
    <label className="flex items-center gap-2 text-sm grow min-w-[180px]">
      <span className="text-slate-500 shrink-0">{t.ctrl_scrub}</span>
      <input type="range" min="0" max="1000" value={Math.round(loop.u * 1000)} className="w-full"
        onChange={(e) => { loop.setPlaying(false); loop.seek(+e.target.value / 1000); }}/>
    </label>
  </div>
);

const AnimPlayer = ({ mode, lang, t, partInfo = true }) => {
  const m = MODES[mode];
  const loop = useAnimLoop(m.dur || 0, m.kind !== 'static');
  const [active, setActive] = useState(null);
  const s = stateFor(mode, loop.u);
  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-5 shadow-sm">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
        <PhasePill s={s} t={t} mode={mode}/>
        <span className="text-xs text-slate-400">{t.anat_hint}</span>
      </div>
      <div className="svgwrap overflow-x-auto" onContextMenu={(e) => { e.preventDefault(); window.showCopyrightToast(); }}>
        <div className="min-w-[320px]"><SwallowSVG mode={mode} u={loop.u} breathU={loop.u} lang={lang} active={active} setActive={setActive}/></div>
      </div>
      <div className="flex flex-wrap gap-4 text-xs text-slate-500 mt-1">
        <span className="flex items-center gap-1"><span className="inline-block w-5 h-0 border-t-[3px] border-dashed" style={{borderColor:'var(--air)'}}></span>{t.legend_air}</span>
        <span className="flex items-center gap-1"><span className="inline-block w-5 h-0 border-t-[3px] border-dashed" style={{borderColor:'var(--food)'}}></span>{t.legend_food}</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full" style={{background:'var(--naso)',opacity:.6}}></span>{t.legend_naso}</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full" style={{background:'var(--oro)',opacity:.6}}></span>{t.legend_oro}</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full" style={{background:'var(--laryngo)',opacity:.6}}></span>{t.legend_laryngo}</span>
      </div>
      {m.kind !== 'static' && <PlayerControls loop={loop} t={t}/>}
      {partInfo && active && (
        <div className="mt-4 p-4 rounded-xl bg-[#004030]/5 dark:bg-[#D8C3A5]/10 border-l-4 border-[#D8C3A5] animate-fade-in">
          <p className="font-serif font-bold text-[#004030] dark:text-[#D8C3A5]">{PART_NAMES[active][0]} · {PART_NAMES[active][1]}</p>
          <p className="text-base mt-1">{t.part_info[active]}</p>
        </div>
      )}
      <p className="text-xs text-slate-400 mt-3">{t.svg_note}</p>
    </div>
  );
};

    m1_q: [
      { q: "氣管與食道的前後位置為何？", opts: ["氣管在前、食道在後", "食道在前、氣管在後", "兩者左右並排", "兩者是同一條管道"], ans: _A0, exp: "氣管位於頸部前方，食道位於氣管後方、緊貼頸椎。" },
      { q: "下列哪一個構造可以活動，吞嚥時會上抬？", opts: ["硬顎", "軟顎", "頸椎", "鼻中隔"], ans: _A1, exp: "軟顎由肌肉構成，吞嚥時上抬封住鼻咽，避免食物跑進鼻腔。" },

    ],

    /* M2 */
    m2_nav: "2. 呼吸路徑", m2_title: "呼吸路徑",
    m2_overview: "平常呼吸時，空氣從鼻孔進入鼻腔，經過鼻咽、口咽、喉咽，穿過打開的聲帶進入氣管，再到達肺部。此時軟顎放鬆下垂，會厭豎起，聲帶打開，整條呼吸道保持暢通。",
    m2_highlights: ["鼻腔過濾、加溫、加濕", "軟顎放鬆，鼻咽暢通", "會厭豎起", "聲帶打開", "食道入口保持關閉"],
    m2_p1: "鼻腔不只是空氣的入口，它的黏膜與鼻甲能過濾灰塵、加溫並加濕空氣，讓進入肺部的空氣更適合身體使用。空氣通過鼻腔後轉向下方進入鼻咽；此時軟顎放鬆下垂，鼻咽與口咽之間的通道是打開的。",
    m2_p2: "空氣接著沿著咽部往下，經過口咽與喉咽，從豎起的會厭後方進入喉頭。聲帶在呼吸時向兩側打開，讓空氣進出氣管；說話時，聲帶靠近並振動。因此一邊吃東西一邊說話，等於要求聲帶同時打開與關閉，很容易出錯。",
    m2_p3: "呼吸時，食道上括約肌（主要由環咽肌構成）維持收縮關閉，避免空氣大量進入食道，也防止胃裡的東西往上逆流。換句話說，在呼吸模式下，身體預設讓氣管打開、食道關閉；只有在吞嚥的瞬間，這個設定才會短暫反轉。",
    m2_wrapup: "呼吸時的預設狀態是：軟顎下垂、會厭豎起、聲帶打開、食道入口關閉。空氣因此能從鼻腔一路順暢地進入氣管。理解這個預設狀態，就能明白吞嚥時身體需要在不到一秒內完成哪些切換。",
    m2_terms: [
      { front: "鼻甲 Nasal conchae", back: "鼻腔側壁的捲曲構造，增加黏膜面積，幫助空氣加溫加濕。" },
      { front: "喉頭 Larynx", back: "位於氣管上端，內含聲帶，是下呼吸道的入口。" },
      { front: "食道上括約肌 Upper oesophageal sphincter", back: "食道入口的環狀肌肉，平時關閉，吞嚥時放鬆打開。" },
      { front: "氣管 Trachea", back: "位於頸部前方的管道，把空氣送進肺部。" }
    ],
    m2_q: [
      { q: "平常呼吸時，聲帶的狀態是？", opts: ["緊緊閉合", "打開", "持續振動", "被會厭蓋住"], ans: _A1, exp: "呼吸時聲帶向兩側打開，讓空氣自由進出氣管。" },
      { q: "呼吸時，食道上括約肌通常呈現什麼狀態？", opts: ["收縮關閉", "完全放鬆打開", "上下蠕動", "與聲帶一起振動"], ans: _A0, exp: "食道上括約肌平時關閉，只有在吞嚥時才放鬆打開。" },
      { q: "鼻腔對吸入的空氣有什麼作用？", opts: ["讓空氣變冷變乾", "把空氣送進食道", "過濾、加溫、加濕", "產生聲音"], ans: _A2, exp: "鼻腔黏膜與鼻甲能過濾灰塵，並為空氣加溫加濕。" },
      { q: "為什麼吃東西時說話比較容易嗆到？", opts: ["說話會讓食道變窄", "說話會讓舌頭變大", "說話會讓軟顎變硬", "說話需要聲帶打開與振動，和吞嚥需要的閉合互相衝突"], ans: _A3, exp: "吞嚥時聲帶必須閉合；說話卻需要氣流通過聲帶，兩者同時進行容易讓食物進入呼吸道。" }
    ],

    /* M3 */
    m3_nav: "3. 口腔期", m3_title: "口腔期",
    m3_overview: "吞嚥從嘴巴開始。口腔準備期把食物咀嚼並與唾液混合成食團；口腔期則由舌頭把食團由前往後推送到咽部。這兩個階段可以由我們自主控制，推送本身大約一秒左右，咀嚼時間則依食物而定。",
    m3_highlights: ["咀嚼與唾液", "形成食團", "舌頭由前往後推送", "可以自主控制", "嘴唇閉緊"],
    m3_p1: "口腔準備期：牙齒咀嚼食物，唾液將它濕潤，舌頭與臉頰把食物集中成一團柔軟、容易吞嚥的食團。嘴唇必須閉緊，避免食物或液體從嘴角流出；這時軟顎通常會與舌根靠在一起，暫時把食物留在口腔內。",
    m3_p2: "口腔期：舌尖頂住上排牙齒後方的硬顎，舌頭像波浪一樣由前往後依序抬起，把食團擠向口腔後方。這個動作就像擠牙膏，舌頭與硬顎之間產生的壓力，是推動食團前進的主要動力。",
    m3_p3: "當食團被推到舌根、接近口咽時，便會啟動吞嚥反射，進入下一個階段。舌頭力量不足、嘴唇閉合不良或口腔感覺下降的人，常會出現食物殘留在嘴裡、含在口中遲遲吞不下去，或食物提早滑進咽部等情形，這些都會提高嗆咳的風險。",
    m3_wrapup: "口腔期的重點是把食物準備好、送到對的位置。咀嚼形成食團，嘴唇閉緊，舌頭由前往後推送。這一段可以由意志控制，因此專心進食、小口慢慢吃，是預防嗆咳最簡單也最有效的方法。",
    m3_terms: [
      { front: "食團 Bolus", back: "咀嚼並與唾液混合後，準備吞下的一團食物。" },
      { front: "口腔準備期 Oral preparatory phase", back: "咀嚼並形成食團的階段，可以自主控制。" },
      { front: "口腔期 Oral phase", back: "舌頭把食團由前往後推送到咽部的階段。" },
      { front: "吞嚥反射 Swallowing reflex", back: "食團到達咽部時自動觸發的一連串保護與推送動作。" }
    ],
    m3_q: [
      { q: "口腔期推送食團的主要構造是？", opts: ["會厭", "聲帶", "舌頭", "食道"], ans: _A2, exp: "舌頭由前往後抬起，把食團擠向咽部。" },
      { q: "口腔準備期與口腔期的共同特點是？", opts: ["可以自主控制", "完全由反射控制", "發生在食道內", "需要聲帶振動"], ans: _A0, exp: "這兩個階段都可以由意志控制，咽部期與食道期才是反射。" },
      { q: "舌頭推送食團的動作，最像下列哪一個比喻？", opts: ["吹氣球", "擠牙膏", "拉窗簾", "搖扇子"], ans: _A1, exp: "舌頭由前往後依序抬起，像擠牙膏一樣把食團往後推。" },
      { q: "下列哪一項「不是」口腔期問題常見的表現？", opts: ["食物殘留在嘴裡", "含在口中吞不下去", "食物從嘴角流出", "聲帶長繭"], ans: _A3, exp: "聲帶長繭與發聲有關，不屬於口腔期的吞嚥問題。" }
    ],

    /* M4 */
    m4_nav: "4. 咽部期", m4_title: "咽部期：三道門",
    m4_overview: "食團進入咽部後，吞嚥反射啟動，身體在大約一秒內自動完成一連串動作：關上通往鼻子的門、關上通往氣管的門、打開通往食道的門。這是整個吞嚥過程最關鍵、也最容易出錯的階段。",
    m4_highlights: ["反射動作，不受意志控制", "軟顎上抬封住鼻咽", "喉頭與舌骨上提前移", "會厭翻轉蓋住喉頭", "聲帶閉合、呼吸暫停", "食道上括約肌打開"],
    m4_p1: "第一道門：軟顎上抬並向後貼住咽後壁，封住鼻咽，這稱為顎咽閉合，可以避免食物或水從鼻子跑出來。同時，咽部肌肉由上往下依序收縮，把食團往下推。",
    m4_p2: "第二道門：喉頭與舌骨向上、向前移動，讓喉頭躲到舌根下方；會厭隨之向後下方翻轉，蓋住喉頭入口；聲帶則緊緊閉合。呼吸道因此有三層保護：會厭、喉頭入口的皺襞，以及聲帶。這段時間呼吸會短暫停止，稱為吞嚥性呼吸暫停，通常不到一秒。",
    m4_p3: "第三道門：喉頭上提前移的動作，也會把食道入口拉開，加上食道上括約肌放鬆，食團便能順利進入食道。食團主要從會厭兩側繞過，經過梨狀窩後進入食道。吞完之後，呼吸通常以吐氣重新開始，這個順序也有助於把殘留在喉頭附近的少量食物吹出去。",
    m4_wrapup: "咽部期在大約一秒內完成三件事：關鼻咽、關氣管、開食道。任何一個動作慢了半拍或力量不足，食物就可能走錯路。動畫可以放慢到 0.25 倍，或用逐格滑桿仔細觀察每一道門的開關順序。",
    m4_terms: [
      { front: "顎咽閉合 Velopharyngeal closure", back: "軟顎上抬貼住咽後壁，封住鼻咽。" },
      { front: "喉頭上提 Laryngeal elevation", back: "喉頭與舌骨向上前方移動，保護呼吸道並拉開食道入口。" },
      { front: "吞嚥性呼吸暫停 Swallow apnoea", back: "吞嚥時呼吸短暫停止，通常不到一秒。" },
      { front: "會厭翻轉 Epiglottic inversion", back: "會厭向後下方翻轉，蓋住喉頭入口。" },
      { front: "環咽肌 Cricopharyngeus", back: "構成食道上括約肌的主要肌肉，吞嚥時放鬆。" }
    ],
    m4_q: [
      { q: "咽部期時，軟顎上抬的主要目的是？", opts: ["封住鼻咽，避免食物跑進鼻腔", "幫助咀嚼", "打開氣管", "讓聲帶振動"], ans: _A0, exp: "顎咽閉合可以避免食物或水從鼻子跑出來。" },
      { q: "下列哪一項「不是」咽部期保護呼吸道的動作？", opts: ["會厭翻轉", "聲帶閉合", "喉頭上提前移", "食道上括約肌收縮關閉"], ans: _A3, exp: "咽部期時食道上括約肌是放鬆打開的，讓食團進入食道；其他三項都是保護呼吸道的動作。" },
      { q: "吞嚥性呼吸暫停通常持續多久？", opts: ["約 10 秒", "約 30 秒", "通常不到 1 秒", "約 1 分鐘"], ans: _A2, exp: "呼吸暫停時間很短，通常不到一秒，吞完後便恢復呼吸。" },
      { q: "吞嚥結束後，呼吸通常以哪一種方式重新開始？", opts: ["吸氣", "吐氣", "打噴嚏", "咳嗽"], ans: _A1, exp: "吞嚥後以吐氣開始，有助於把殘留在喉頭附近的食物吹出去。" }
    ],

    /* M5 */
    m5_nav: "5. 食道期", m5_title: "食道期",
    m5_overview: "食團通過食道上括約肌後，就進入食道期。食道壁的肌肉以蠕動的方式，一波接一波地把食團往下推送到胃。這個階段不受意志控制，大約需要 8 到 20 秒。",
    m5_highlights: ["蠕動波", "不受意志控制", "約 8–20 秒", "食道上、下括約肌", "喉頭歸位、恢復呼吸"],
    m5_p1: "食團一進入食道，食道上括約肌立即重新收縮關閉，防止食物逆流回咽部。同時喉頭下降回到原位，會厭重新豎起，聲帶打開，呼吸恢復。也就是說，從這時開始，呼吸與食團的運送已經分開進行。",
    m5_p2: "食道本身是一條肌肉管道，透過有節奏的收縮與放鬆，形成由上往下傳遞的蠕動波，所以即使躺著，食物也能被送到胃裡。食道下端還有食道下括約肌，食團到達時放鬆打開，之後再關閉，避免胃酸逆流。",
    m5_p3: "如果蠕動變弱，或括約肌無法正常放鬆，食物可能卡在胸口、吞下後又逆流上來，或出現胸口灼熱感。進食後維持坐姿約 30 分鐘，可以藉由重力幫助食物往下，並減少逆流的機會。",
    m5_wrapup: "食道期由蠕動完成，不受意志控制，大約需要 8 到 20 秒。此時喉頭已回到原位，呼吸恢復正常。進食後保持上半身直立一段時間，是幫助食道期順利完成的簡單方法。",
    m5_terms: [
      { front: "蠕動 Peristalsis", back: "食道肌肉由上往下的波浪狀收縮，推送食團。" },
      { front: "食道下括約肌 Lower oesophageal sphincter", back: "食道與胃交界處的環狀肌肉，防止胃酸逆流。" },
      { front: "逆流 Reflux", back: "胃內容物往上回到食道，甚至到達咽部。" },
      { front: "食道期 Oesophageal phase", back: "食團由食道送到胃的階段，約 8–20 秒。" }
    ],
    m5_q: [
      { q: "食道推送食團主要依靠什麼？", opts: ["只靠重力", "蠕動", "舌頭", "呼吸"], ans: _A1, exp: "食道肌肉的蠕動波把食團往下推，因此躺著也能吞嚥。" },
      { q: "食道期大約需要多久？", opts: ["不到 1 秒", "約 1 小時", "約 8–20 秒", "約 5 分鐘"], ans: _A2, exp: "食道期通常約 8 到 20 秒。" },
      { q: "食團進入食道後，食道上括約肌會？", opts: ["重新收縮關閉", "持續打開", "開始振動", "移到胃部"], ans: _A0, exp: "重新關閉可以防止食物逆流回咽部。" },
      { q: "進食後建議維持坐姿一段時間，主要原因是？", opts: ["幫助聲帶休息", "讓軟顎上抬", "讓會厭變硬", "藉由重力幫助食物往下並減少逆流"], ans: _A3, exp: "直立姿勢可以藉由重力協助食物下行，並減少逆流。" }
    ],

    /* M6 */
    m6_nav: "6. 嗆咳與吸入", m6_title: "嗆咳與吸入",
    m6_overview: "如果保護呼吸道的動作太慢或不完全，食物或液體就可能進入喉頭（滲入），甚至穿過聲帶掉進氣管（吸入）。正常情況下身體會用咳嗽把它咳出來；但有些人沒有咳嗽反應，稱為無聲吸入，風險更高。",
    m6_highlights: ["滲入與吸入", "咳嗽是保護反射", "無聲吸入", "吸入性肺炎", "警訊徵兆"],
    m6_p1: "滲入是指食物進入喉頭入口，但仍停留在聲帶上方；吸入則是食物穿過聲帶進入氣管。常見原因包括：吞嚥反射啟動太慢、會厭翻轉或喉頭上提不完全、聲帶閉合不良，或食物殘留在會厭谿與梨狀窩，吞完之後才掉進呼吸道。",
    m6_p2: "咳嗽是身體把異物排出呼吸道的重要反射。然而中風、帕金森氏症、失智症、頭頸部癌症治療後的病人，或年長、身體虛弱的人，可能咳嗽反射變弱，甚至完全沒有反應。無聲吸入不容易被察覺，食物與口腔細菌反覆進入肺部，可能導致吸入性肺炎。",
    m6_p3: "需要留意的警訊包括：吃飯或喝水時常常嗆咳、吞完後聲音變得濕濕的或有痰音、食物含在嘴裡、吃一餐的時間明顯變長、體重下降，以及反覆發燒或肺炎。出現這些情形時，請盡早與醫師或語言治療師討論，必要時安排吞嚥評估。",
    m6_wrapup: "嗆咳代表身體正在保護呼吸道，但沒有咳嗽不一定代表安全。認識滲入、吸入與無聲吸入的差別，留意進食時的警訊，並在專業人員指導下調整姿勢與食物質地，就能降低吸入性肺炎的風險。",
    m6_terms: [
      { front: "滲入 Penetration", back: "食物進入喉頭入口，但停留在聲帶上方。" },

    m0_nav: "0. Executive Summary",
    m0_title: "Air Goes Forward, Food Goes Back",
    m0_intro: "Swallowing is something we do hundreds of times a day without thinking, yet it needs dozens of muscles in the lips, tongue, soft palate, pharynx, larynx and oesophagus to work together within a fraction of a second. What makes it remarkable is that the airway and the food passage cross in the pharynx. Air must travel forward into the trachea, while food must travel backward into the oesophagus, and both share the same stretch of throat. If the timing slips, food can go down the wrong way, causing choking or coughing and sometimes aspiration pneumonia. This guide uses an original animated cross-section of the head and neck to walk you through the breathing pathway, the oral, pharyngeal and oesophageal phases of swallowing, and what happens when food enters the airway. Every unit includes bilingual narration, animation you can slow down or step through, flashcards and a short quiz. It is written for patients, families, caregivers and health-science students.",
    m0_why: "Why learn about swallowing?",
    m0_why_desc: "Swallowing difficulty (dysphagia) is common after stroke and in Parkinson's disease, dementia, head and neck cancer, and older age. Spotting the warning signs early and getting assessed lowers the risk of choking, malnutrition, dehydration and aspiration pneumonia, and helps mealtimes feel safe and enjoyable again.",

    m0_start: "Start learning →",

    m1_nav: "1. Anatomy Tour", m1_title: "Anatomy Tour",
    m1_overview: "Swallowing and breathing share one passage: the pharynx. Knowing where the nose, mouth, pharynx, larynx and oesophagus sit in relation to each other is the first step to understanding why we choke. Tap any name on the right of the diagram to highlight that structure.",
    m1_highlights: ["Nasal and oral cavities", "Hard and soft palate", "Three parts of the pharynx", "Epiglottis and vocal folds", "Trachea in front, oesophagus behind"],
    m1_p1: "A cross-section of the head and neck shows two roads meeting. Air enters through the nose (or mouth), food enters through the mouth, and both must pass through the pharynx. The pharynx has three sections by height: the nasopharynx behind the nose, the oropharynx behind the mouth, and the laryngopharynx above and behind the larynx. Below that, the road splits in two: the trachea in front leads to the lungs, and the oesophagus behind leads to the stomach.",
    m1_p2: "The roof of the mouth has two parts. The front part, supported by bone, is the hard palate. The back part, made of muscle and able to move, is the soft palate, ending in the small hanging uvula. The small pocket between the tongue base and the epiglottis is the vallecula, and the channels on either side of the laryngopharynx are the piriform sinuses. These are the places where food residue most often collects.",
    m1_p3: "The epiglottis is a leaf-shaped cartilage behind the tongue base. It normally stands upright so air can move freely in and out of the trachea; during a swallow it tips backward and down to cover the entrance of the larynx. The vocal folds sit inside the larynx. They open for breathing and speaking and close tightly during swallowing, forming the last gate that protects the airway. Because the trachea lies in front and the oesophagus behind, the two paths cross, and that is why swallowing needs such precise timing.",
    m1_wrapup: "The pharynx is shared by breathing and swallowing, with the trachea in front and the oesophagus behind. The soft palate, epiglottis and vocal folds act like three gates that decide where air and food go. Keep this route map in mind and every movement in the next units will make sense.",
    m1_terms: [
      { front: "硬顎 Hard palate", back: "The bony front part of the roof of the mouth. It does not move." },
      { front: "軟顎 Soft palate", back: "The muscular back part of the roof of the mouth. It lifts to seal the nasopharynx during swallowing." },
      { front: "會厭 Epiglottis", back: "A leaf-shaped cartilage behind the tongue base that tips back to cover the larynx during swallowing." },
      { front: "聲帶 Vocal folds", back: "Inside the larynx; open for breathing, closed during swallowing." },
      { front: "會厭谿 Vallecula", back: "The pocket between the tongue base and the epiglottis, where food often lingers." },
      { front: "梨狀窩 Piriform sinus", back: "Channels on each side of the laryngopharynx that food passes through around the epiglottis." }
    ],
    m1_q: [
      { q: "How are the trachea and oesophagus arranged?", opts: ["Trachea in front, oesophagus behind", "Oesophagus in front, trachea behind", "Side by side, left and right", "They are the same tube"], ans: _A0, exp: "The trachea lies at the front of the neck; the oesophagus sits behind it, against the spine." },
      { q: "Which structure can move and lifts during swallowing?", opts: ["Hard palate", "Soft palate", "Cervical spine", "Nasal septum"], ans: _A1, exp: "The soft palate is muscular. It lifts to seal the nasopharynx so food does not enter the nose." },
      { q: "What is the correct order of the pharynx from top to bottom?", opts: ["Oropharynx, nasopharynx, laryngopharynx", "Laryngopharynx, oropharynx, nasopharynx", "Nasopharynx, oropharynx, laryngopharynx", "Nasopharynx, laryngopharynx, oropharynx"], ans: _A2, exp: "The nasopharynx is behind the nose, the oropharynx behind the mouth, and the laryngopharynx is lowest, just above the split into trachea and oesophagus." },
      { q: "What do the vallecula and piriform sinuses have in common?", opts: ["They produce the voice", "They are the main air route to the lungs", "They are inside the nasal cavity", "Food residue tends to collect there"], ans: _A3, exp: "Both are pockets where food can linger when the swallow is weak, and may later fall into the airway." }
    ],

    m2_nav: "2. Breathing Pathway", m2_title: "Breathing Pathway",
    m2_overview: "During normal breathing, air enters the nostrils, passes through the nasal cavity, nasopharynx, oropharynx and laryngopharynx, goes through the open vocal folds into the trachea and on to the lungs. The soft palate hangs relaxed, the epiglottis stands upright and the vocal folds are open, so the whole airway is clear.",
    m2_highlights: ["The nose filters, warms and humidifies", "Soft palate relaxed, nasopharynx open", "Epiglottis upright", "Vocal folds open", "Oesophageal entrance closed"],
    m2_p1: "The nose is more than an entrance. Its lining and turbinates trap dust and warm and humidify the air so that it suits the lungs better. After the nasal cavity, air turns downward into the nasopharynx. At this moment the soft palate hangs relaxed, so the passage between the nasopharynx and oropharynx is open.",
    m2_p2: "Air then travels down the pharynx, through the oropharynx and laryngopharynx, and enters the larynx behind the upright epiglottis. The vocal folds move apart during breathing to let air in and out of the trachea; when we speak, they come together and vibrate. Talking while eating therefore asks the vocal folds to be open and closed at the same time, which invites mistakes.",
    m2_p3: "While we breathe, the upper oesophageal sphincter, formed mainly by the cricopharyngeus muscle, stays contracted and closed. This keeps large amounts of air out of the oesophagus and stops stomach contents from flowing back up. In breathing mode, the body's default is airway open and oesophagus closed; only for the instant of a swallow is that setting briefly reversed.",
    m2_wrapup: "The default breathing setting is: soft palate down, epiglottis up, vocal folds open, oesophageal entrance closed. Air can therefore flow smoothly from the nose into the trachea. Understanding this default makes clear how many switches the body must make in under a second when we swallow.",
    m2_terms: [
      { front: "鼻甲 Nasal conchae", back: "Curled shelves on the side walls of the nose that enlarge the lining to warm and humidify air." },
      { front: "喉頭 Larynx", back: "At the top of the trachea, containing the vocal folds; the entrance to the lower airway." },
      { front: "食道上括約肌 Upper oesophageal sphincter", back: "A ring of muscle at the top of the oesophagus, closed at rest and relaxed during swallowing." },
      { front: "氣管 Trachea", back: "The tube at the front of the neck that carries air into the lungs." }
    ],
    m2_q: [
      { q: "What are the vocal folds doing during normal breathing?", opts: ["Tightly closed", "Open", "Constantly vibrating", "Covered by the epiglottis"], ans: _A1, exp: "During breathing the vocal folds move apart so air can flow freely in and out of the trachea." },
      { q: "What is the upper oesophageal sphincter usually doing while we breathe?", opts: ["Contracted and closed", "Fully relaxed and open", "Moving in waves", "Vibrating with the vocal folds"], ans: _A0, exp: "It stays closed at rest and only relaxes to open during a swallow." },
      { q: "What does the nose do to the air we breathe in?", opts: ["Makes it colder and drier", "Sends it into the oesophagus", "Filters, warms and humidifies it", "Produces sound"], ans: _A2, exp: "The nasal lining and turbinates trap dust and warm and humidify the air." },
      { q: "Why is talking while eating more likely to cause choking?", opts: ["Talking narrows the oesophagus", "Talking makes the tongue swell", "Talking stiffens the soft palate", "Talking needs open, vibrating vocal folds, which conflicts with the closure swallowing needs"], ans: _A3, exp: "The vocal folds must close to swallow, but speech needs air to pass through them. Doing both at once lets food slip into the airway." }
    ],

    m3_nav: "3. Oral Phase", m3_title: "Oral Phase",
    m3_overview: "Swallowing starts in the mouth. In the oral preparatory phase, food is chewed and mixed with saliva into a bolus; in the oral phase, the tongue pushes the bolus from front to back towards the pharynx. Both stages are under voluntary control. The push itself takes about a second, while chewing time depends on the food.",
    m3_highlights: ["Chewing and saliva", "Forming a bolus", "Tongue pushes front to back", "Voluntary control", "Lips sealed"],
    m3_p1: "Oral preparatory phase: the teeth chew the food, saliva moistens it, and the tongue and cheeks gather it into a soft, easy-to-swallow bolus. The lips must stay closed so food and liquid do not leak from the corners of the mouth. The soft palate usually rests against the back of the tongue at this stage, holding the food in the mouth for now.",
    m3_p2: "Oral phase: the tongue tip presses against the hard palate behind the upper teeth, then the tongue rises in a wave from front to back, squeezing the bolus towards the back of the mouth. It works like squeezing a tube of toothpaste: the pressure between the tongue and the hard palate is the main force that moves the bolus.",
    m3_p3: "When the bolus reaches the tongue base and approaches the oropharynx, the swallowing reflex fires and the next phase begins. People with a weak tongue, poor lip closure or reduced sensation in the mouth may have food left in the mouth, hold food without swallowing it, or let food slip into the pharynx too early. Each of these raises the risk of choking.",
    m3_wrapup: "The oral phase is about getting the food ready and into the right place. Chewing forms the bolus, the lips stay sealed, and the tongue pushes from front to back. Because this stage is voluntary, paying attention while eating and taking small, slow mouthfuls is the simplest and most effective way to prevent choking.",

/* ===== Shared components ===== */
const shuffleIdx = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const H2 = ({ children, icon, number }) => (
  <h2 className="text-2xl sm:text-3xl md:text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5] mb-6 flex items-center gap-3" style={{textWrap:'balance'}}>
    {icon && <span className="text-2xl" aria-hidden="true">{icon}</span>}
    {number !== undefined && <span>{number}.</span>}
    <span>{children}</span>
  </h2>
);

const Label = ({ children }) => <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">{children}</h3>;

const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [order] = useState(() => shuffleIdx(terms.length));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const current = order.slice(groupIdx * groupSize, groupIdx * groupSize + groupSize);
  useEffect(() => {
    setShownSet(prev => { const n = new Set(prev); current.forEach(i => n.add(i)); return n; });
  }, [groupIdx]);
  const handleFlip = (idx) => {
    setFlipped(f => ({ ...f, [idx]: !f[idx] }));
    if (!readSet.has(idx)) {
      const nr = new Set(readSet); nr.add(idx); setReadSet(nr);
      onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length);
    }
  };
  const status = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-2">
      <Label>{t.key_terms}</Label>
      <p className="text-sm text-slate-400 mb-4">{status}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {current.map(idx => {
          const term = terms[idx];
          return (
            <div key={idx} className="perspective cursor-pointer h-40" onClick={() => handleFlip(idx)} role="button" tabIndex="0"
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleFlip(idx); } }}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[idx] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center">
                  <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups - 1 && setGroupIdx(groupIdx + 1)} disabled={groupIdx >= totalGroups - 1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => shuffleIdx(questions.length));
  const [shuffledMaps] = useState(() => quizIndices.map(q => shuffleIdx(questions[q].opts.length)));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const isRight = (qi) => selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[quizIndices[qi]].ans);
  const correctCount = quizIndices.reduce((c, _, qi) => c + (isRight(qi) ? 1 : 0), 0);
  const status = t.quiz_status.replace('{correct}', correctCount).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const start = groupIdx * groupSize;
  const current = quizIndices.slice(start, start + groupSize);
  const groupReady = current.every((_, i) => selected[start + i] !== undefined);
  const handleGroupSubmit = () => {
    if (!groupReady) return;
    const ns = { ...submitted, [groupIdx]: true };
    setSubmitted(ns);
    if (Object.keys(ns).length === totalGroups) {
      const wrong = []; let c = 0;
      quizIndices.forEach((q, qi) => { if (isRight(qi)) c++; else wrong.push(questions[q].q); });
      onQuizSubmit(moduleId, c, quizIndices.length, wrong, moduleName);
    }
  };
  return (
    <div className="bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{status}</p>
      {current.map((qIdx, li) => {
        const qi = start + li; const q = questions[qIdx]; const sub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3 text-base">{qi + 1}. {q.q}</p>
            <div className="space-y-2">
              {shuffledMaps[qi].map((orig, dIdx) => {
                const ok = orig === _d(q.ans); const sel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !sub && setSelected(s => ({ ...s, [qi]: dIdx }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${sub
                      ? ok ? 'bg-green-100 border-green-500 dark:bg-green-900/30' : sel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : sel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/10' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[orig]}
                  </button>
                );
              })}
            </div>
            {sub && <p className={`mt-2 text-sm italic ${isRight(qi) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
              {isRight(qi) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}</p>}
          </div>
        );
      })}
      <div className="flex items-center gap-3">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!groupReady} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>

};

/* ===== App ===== */
function App() {
  const LS_KEY = 'SWL_SPA_analytics', LS_STU = 'SWL_SPA_student', LS_VER = 'SWL_SPA_version';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
  const emptyAnalytics = () => ({ time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0), quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0), cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {} });

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group: '', dept: '', id: '', nameEn: '', nameZh: '' }));
  const [analytics, setAnalytics] = useState(() => {
    const a = loadLS(LS_KEY, null);
    return a && Array.isArray(a.time) && a.time.length === TOTAL ? a : emptyAnalytics();
  });
  const menuRef = useRef(null);
  const t = dict[lang];

  const modulesList = [...Array(TOTAL).keys()].map(id => ({
    id, icon: MODULE_ICONS[id], num: id,
    nav: id === IDX_LAB ? t.mlab_nav : id === IDX_RES ? t.mres_nav : id === IDX_ANA ? t.analytics_nav : t[`m${id}_nav`],
    title: id === IDX_LAB ? t.mlab_title : id === IDX_RES ? t.mres_title : id === IDX_ANA ? t.analytics_title : t[`m${id}_title`],
  }));

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'en-GB'; }, [lang]);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    try {
      const v = localStorage.getItem(LS_VER);
      const hasData = loadLS(LS_KEY, null);
      if (v && v !== VERSION && hasData && window.confirm(dict.zh.analytics_refresh_prompt + '\n' + dict.en.analytics_refresh_prompt)) setAnalytics(emptyAnalytics());
      localStorage.setItem(LS_VER, VERSION);
    } catch {}
  }, []);
  useEffect(() => {
    const id = setInterval(() => {
      if (document.hidden) return;
      setAnalytics(a => { const tm = [...a.time]; tm[module] += 1; return { ...a, time: tm }; });
    }, 1000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
  }, []);
  useEffect(() => () => { try { speechSynthesis.cancel(); } catch {} }, []);

  const go = (m) => { try { speechSynthesis.cancel(); } catch {} setTtsState('idle'); setModule(m); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const countClick = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return { ...a, clicks: c }; });

  const handleQuizSubmit = (mid, correct, total, wrongQs) => {
    setAnalytics(a => {
      const qc = [...a.quizCorrect], qt = [...a.quizTotal]; qc[mid] = correct; qt[mid] = total;
      return { ...a, quizCorrect: qc, quizTotal: qt, wrongTopics: { ...a.wrongTopics, [mid]: wrongQs || [] } };
    });
  };
  const handleCardRead = (mid, readCount, shownCount, totalCount) => {
    setAnalytics(a => {
      const cr = [...a.cardsRead], ct = [...a.cardsTotal]; cr[mid] = Math.max(cr[mid], readCount); ct[mid] = totalCount;
      return { ...a, cardsRead: cr, cardsTotal: ct };
    });
  };

  /* ---- TTS ---- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.title, t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`), t.m0_disclaimer];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const mk = `m${module}`;
      texts = [t[`${mk}_title`], t.overview_label, t[`${mk}_overview`], ...t[`${mk}_highlights`], t.deep_dive_label,
        ...[1,2,3,4,5].map(n => t[`${mk}_p${n}`]).filter(Boolean),
        ...t[`${mk}_terms`].flatMap(x => [x.front, x.back]), t.wrapup_label, t[`${mk}_wrapup`]];
    } else if (module === IDX_LAB) {
      texts = [t.mlab_title, t.mlab_desc, ...t.mlab_labs.map(l => `${l.title}. ${l.desc}`)];
    } else if (module === IDX_RES) {
      texts = [t.mres_title, t.mres_desc, ...t.mres_groups.flatMap(g => [g.title, ...g.links.map(l => l.desc)])];
    } else if (module === IDX_ANA) {
      const tc = analytics.quizCorrect.reduce((a, b) => a + b, 0), ta = analytics.quizTotal.reduce((a, b) => a + b, 0);
      const oa = ta > 0 ? Math.round(tc / ta * 100) : 0;
      const wk = [];
      for (let i = 1; i <= NUM_LEARN; i++) if (analytics.quizTotal[i] > 0) { const a = Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100); if (a < 75) wk.push({ name: modulesList[i].title, acc: a }); }
      wk.sort((a, b) => a.acc - b.acc);
      texts = [t.analytics_title, t.analytics_desc, `${t.analytics_total_time}: ${analytics.time.reduce((a, b) => a + b, 0)} ${t.analytics_sec}`, `${t.analytics_total_clicks}: ${analytics.clicks.reduce((a, b) => a + b, 0)} ${t.analytics_times}`, `${t.analytics_overall_acc}: ${oa}%`];
      if (wk.length) { texts.push(t.analytics_wp_tts_intro); wk.forEach(w => texts.push(t.analytics_wp_tts_module.replace('{name}', w.name).replace('{acc}', w.acc))); }
      else if (ta > 0) texts.push(t.analytics_wp_tts_allpass);
    }
    const clean = texts.filter(Boolean).map(s => s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}→←↑]/gu, '').trim());
    const utt = new SpeechSynthesisUtterance(clean.join(sep));
    utt.rate = 0.95;
    const voices = speechSynthesis.getVoices();
    if (lang === 'zh') {
      const v = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh'));
      if (v) utt.voice = v; utt.lang = 'zh-TW';
    } else {
      const v = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
      if (v) utt.voice = v; utt.lang = 'en-GB';
    }
    utt.onend = () => setTtsState('idle'); utt.onerror = () => setTtsState('idle');
    speechSynthesis.speak(utt); setTtsState('playing');
  };

  /* ---- Analytics helpers ---- */
  const sanitizeStudentId = (v) => v.replace(/[^0-9]/g, '').slice(0, 12);
  const sanitizeName = (v) => v.replace(/[<>"'&\\]/g, '').slice(0, 50);
  const infoComplete = studentInfo.group && studentInfo.dept && studentInfo.id && studentInfo.nameEn && studentInfo.nameZh;
  const clearAnalytics = () => {
    if (!window.confirm(t.analytics_wp_clear_confirm)) return;
    try { localStorage.removeItem(LS_KEY); } catch {}
    setAnalytics(emptyAnalytics());
  };
  const exportCSV = () => {
    if (!infoComplete) return;
    const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const rows = [['Group', 'Dept', 'Student ID', 'Name (EN)', 'Name (ZH)'].map(esc).join(','),
      [studentInfo.group, studentInfo.dept, studentInfo.id, studentInfo.nameEn, studentInfo.nameZh].map(esc).join(','), '',
      ['Unit', 'Time (s)', 'Clicks', 'Cards Read', 'Cards Total', 'Quiz Correct', 'Quiz Total', 'Accuracy (%)', 'Wrong Questions'].map(esc).join(',')];
    for (let i = 0; i < TOTAL; i++) {
      const acc = analytics.quizTotal[i] ? Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100) : '';
      rows.push([modulesList[i].nav, analytics.time[i], analytics.clicks[i], analytics.cardsRead[i], analytics.cardsTotal[i], analytics.quizCorrect[i], analytics.quizTotal[i], acc, (analytics.wrongTopics[i] || []).join(' | ')].map(esc).join(','));
    }
    const d = new Date(); const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `${dict.zh.brand} ${dict.zh.title}_${studentInfo.nameEn} ${studentInfo.nameZh}_${ymd}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  /* ---- Views ---- */
  const renderM0 = () => (
    <div className="space-y-8 animate-fade-in">
      <section className="rounded-3xl bg-[#004030] text-white p-6 sm:p-8 overflow-hidden">
        <div className="grid lg:grid-cols-2 gap-6 items-center">
          <div className="min-w-0">
            <p className="text-[#D8C3A5] text-xs font-bold uppercase tracking-[0.2em] mb-3">{t.brand} · {t.subtitle}</p>
            <h1 className="font-serif font-black text-3xl sm:text-4xl leading-tight mb-2" style={{textWrap:'balance'}}>{t.title}</h1>
            <p className="font-serif italic text-[#D8C3A5] text-xl mb-4">{t.m0_title}</p>
            <p className="text-base leading-relaxed text-white/90">{t.m0_intro}</p>
            <button onClick={() => go(1)} className="mt-6 px-6 py-3 bg-[#D8C3A5] text-[#004030] font-bold rounded-xl hover:bg-white transition-colors">{t.m0_start}</button>
          </div>
          <div className="min-w-0 text-slate-800 dark:text-slate-200"><AnimPlayer mode="full" lang={lang} t={t} partInfo={false}/></div>
        </div>
      </section>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {t.m0_stats.map((s, i) => (
          <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700">
            <p className="font-serif font-black text-2xl text-[#004030] dark:text-[#D8C3A5] tabular-nums">{s.val}</p>
            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">{s.label}</p>
          </div>
        ))}
      </div>
      <section>
        <h3 className="font-serif font-bold text-xl text-[#004030] dark:text-[#D8C3A5] mb-2">{t.m0_why}</h3>
        <p className="text-lg leading-relaxed">{t.m0_why_desc}</p>
        <div className="mt-4 flex gap-3 p-4 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-200">
          <IconAlertTriangle className="shrink-0 mt-0.5"/><p className="text-sm">{t.m0_disclaimer}</p>
        </div>
      </section>
      <section className="grid sm:grid-cols-2 gap-3">
        {t.m0_modules.map((m, i) => (
          <button key={i} onClick={() => go(i + 1)} className="text-left flex gap-4 bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-colors">
            <span className="font-serif font-black text-2xl text-[#D8C3A5] dark:text-[#D8C3A5]/70 tabular-nums">{m.num}</span>
            <span className="min-w-0"><span className="block font-bold text-[#004030] dark:text-[#D8C3A5]">{MODULE_ICONS[i + 1]} {m.title}</span><span className="block text-sm text-slate-500 dark:text-slate-400 mt-1">{m.desc}</span></span>
          </button>
        ))}
      </section>
    </div>
  );

  const renderLearn = () => {
    const mk = `m${module}`;
    return (
      <div className="space-y-8 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
        <H2 icon={MODULE_ICONS[module]} number={module}>{t[`${mk}_title`]}</H2>
        <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">{t.overview_label}</h3>
          <p>{t[`${mk}_overview`]}</p>
        </div>
        <div>
          <Label>{t.highlights_label}</Label>
          <div className="flex flex-wrap gap-2">
            {t[`${mk}_highlights`].map((h, i) => <span key={i} className="px-3 py-1 bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] rounded-full text-sm font-medium">{h}</span>)}
          </div>
        </div>
        <div className="space-y-4">
          <Label>{t.deep_dive_label}</Label>
          <p>{t[`${mk}_p1`]}</p>
          <p className="p-4 bg-slate-100 dark:bg-slate-800 rounded-lg italic font-serif text-base">{t[`${mk}_p2`]}</p>
          <p>{t[`${mk}_p3`]}</p>
        </div>
        <div>
          <Label>{t.anim_label}</Label>
          <AnimPlayer key={`anim-${module}`} mode={MODULE_ANIM[module]} lang={lang} t={t}/>
        </div>
        <FlipCardDeck key={`cards-${module}-${lang}`} terms={t[`${mk}_terms`]} t={t} moduleId={module} onCardRead={handleCardRead}/>

          <p className="italic">{t[`${mk}_wrapup`]}</p>
        </div>
        <ModuleQuiz key={`quiz-${module}`} questions={t[`${mk}_q`]} t={t} moduleId={module} onQuizSubmit={handleQuizSubmit} moduleName={t[`${mk}_title`]}/>

    );

    <div className="space-y-6 animate-fade-in">

      <p className="text-lg leading-relaxed">{t.mlab_desc}</p>

      <LabCard n={2} title={t.mlab_labs[1].title} desc={t.mlab_labs[1].desc}><CompareLab lang={lang} t={t}/></LabCard>
      <LabCard n={3} title={t.mlab_labs[2].title} desc={t.mlab_labs[2].desc}><OrderLab key={`order-${lang}`} t={t}/></LabCard>

    <div className="space-y-6 animate-fade-in">
      <H2 icon={MODULE_ICONS[IDX_RES]} number={IDX_RES}>{t.mres_title}</H2>

          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{g.title}</h3>
          <div className="grid sm:grid-cols-2 gap-3">{g.links.map((l, j) => <LinkCard key={j} {...l}/>)}</div>
        </section>
      ))}
    </div>
  );

  const renderAna = () => {
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    const tc = sum(analytics.quizCorrect), ta = sum(analytics.quizTotal);
    const oa = ta ? Math.round(tc / ta * 100) : 0;
    const cr = sum(analytics.cardsRead), ctot = [...Array(NUM_LEARN).keys()].reduce((s, i) => s + dict.zh[`m${i + 1}_terms`].length, 0);
    const weak = [];
    for (let i = 1; i <= NUM_LEARN; i++) if (analytics.quizTotal[i]) { const a = Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100); if (a < 75) weak.push({ i, a }); }
    weak.sort((x, y) => x.a - y.a);
    const visited = (i) => analytics.time[i] > 0;
    const learnVisited = [...Array(NUM_LEARN).keys()].filter(k => visited(k + 1)).length;
    const field = (key, label, ph, sanitize) => (
      <label className="block text-sm">
        <span className="font-semibold">{label}</span>
        <input id={`stu-${key}`} value={studentInfo[key]} placeholder={ph} onChange={(e) => setStudentInfo({ ...studentInfo, [key]: sanitize(e.target.value) })}
          className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900"/>
      </label>
    );
    return (
      <div className="space-y-8 animate-fade-in">
        <H2 icon={MODULE_ICONS[IDX_ANA]} number={IDX_ANA}>{t.analytics_title}</H2>
        <p className="text-lg leading-relaxed">{t.analytics_desc}</p>
        <p className="text-sm text-green-700 dark:text-green-400">{t.analytics_wp_saved}</p>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          {[[t.analytics_total_time, `${sum(analytics.time)} ${t.analytics_sec}`], [t.analytics_total_clicks, `${sum(analytics.clicks)} ${t.analytics_times}`], [t.analytics_overall_acc, ta ? `${oa}%` : '—'], [t.analytics_card_usage, `${ctot ? Math.round(cr / ctot * 100) : 0}%`]].map(([l, v], i) => (
            <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700">
              <p className="text-sm text-slate-500">{l}</p><p className="font-serif font-black text-2xl text-[#004030] dark:text-[#D8C3A5] tabular-nums mt-1">{v}</p>
            </div>
          ))}
        </div>
        <section className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg mb-3">{t.analytics_progress_title} <span className="text-sm font-sans text-slate-500 tabular-nums">({learnVisited}/{NUM_LEARN})</span></h3>
          <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 mb-4"><div className="h-2 rounded-full bg-[#004030] dark:bg-[#D8C3A5]" style={{ width: `${learnVisited / NUM_LEARN * 100}%` }}></div></div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {[...Array(NUM_LEARN).keys()].map(k => { const i = k + 1; return (
              <button key={i} onClick={() => go(i)} className="flex items-center justify-between gap-2 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm text-left hover:border-[#004030] dark:hover:border-[#D8C3A5]">
                <span className="truncate">{modulesList[i].nav}</span>
                <span className="flex gap-1 shrink-0">
                  <span className={`px-2 py-0.5 rounded-full text-xs ${visited(i) ? 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300' : 'bg-slate-100 text-slate-500 dark:bg-slate-700'}`}>{visited(i) ? t.analytics_progress_visited : t.analytics_progress_not_visited}</span>
                  {analytics.quizTotal[i] > 0 && <span className="px-2 py-0.5 rounded-full text-xs bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-300">{t.analytics_progress_quiz_done}</span>}
                </span>
              </button>); })}
          </div>
        </section>
        <section className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg mb-3">{t.analytics_wp_title}</h3>
          {ta === 0 ? <p className="text-sm text-slate-500">{t.analytics_wp_none}</p>
            : weak.length === 0 ? <p className="text-sm text-green-700 dark:text-green-400 font-semibold">{t.analytics_wp_allpass}</p>
            : <div className="space-y-3">{weak.map(w => (
                <div key={w.i} className="p-4 rounded-lg border-l-4 border-red-400 bg-red-50 dark:bg-red-900/20">
                  <p className="font-bold">{modulesList[w.i].nav} · <span className="tabular-nums">{w.a}%</span></p>
                  <p className="text-sm mt-1">{t.analytics_wp_incorrect}</p>
                  <ul className="list-disc pl-5 text-sm">{(analytics.wrongTopics[w.i] || []).map((q, j) => <li key={j}>{q}</li>)}</ul>
                  <button onClick={() => go(w.i)} className="text-sm font-bold text-[#004030] dark:text-[#D8C3A5] mt-2">{t.analytics_wp_goto}</button>
                </div>))}</div>}
        </section>
        <section className="overflow-x-auto bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
          <table className="w-full text-sm tabular-nums">
            <thead className="bg-slate-50 dark:bg-slate-900/50 text-left"><tr>
              {[t.analytics_module, t.analytics_time, t.analytics_clicks, t.analytics_cards_read_total, t.analytics_correct_ans_total, t.analytics_acc].map((h, i) => <th key={i} className="px-3 py-2 font-semibold whitespace-nowrap">{h}</th>)}
            </tr></thead>
            <tbody>{modulesList.map(m => (
              <tr key={m.id} className="border-t border-slate-200 dark:border-slate-700">
                <td className="px-3 py-2">{m.nav}</td>
                <td className="px-3 py-2">{analytics.time[m.id]} {t.analytics_sec}</td>
                <td className="px-3 py-2">{analytics.clicks[m.id]}</td>
                <td className="px-3 py-2">{m.id >= 1 && m.id <= NUM_LEARN ? `${analytics.cardsRead[m.id]} / ${t[`m${m.id}_terms`].length}` : '—'}</td>
                <td className="px-3 py-2">{analytics.quizTotal[m.id] ? `${analytics.quizCorrect[m.id]} / ${analytics.quizTotal[m.id]}` : (m.id >= 1 && m.id <= NUM_LEARN ? t.analytics_no_data : '—')}</td>
                <td className="px-3 py-2">{analytics.quizTotal[m.id] ? `${Math.round(analytics.quizCorrect[m.id] / analytics.quizTotal[m.id] * 100)}%` : '—'}</td>
              </tr>))}</tbody>
          </table>
        </section>
        <section className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg mb-4">{t.analytics_form_title}</h3>
          <div className="grid sm:grid-cols-2 gap-4">
            <label className="block text-sm"><span className="font-semibold">{t.analytics_group}</span>
              <select id="stu-group" value={studentInfo.group} onChange={(e) => setStudentInfo({ ...studentInfo, group: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900">
                <option value="">{t.analytics_group_select}</option>{t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select></label>
            {field('dept', t.analytics_dept, t.analytics_dept_ph, (v) => sanitizeName(v).slice(0, 20))}
            {field('id', t.analytics_id, t.analytics_id_ph, sanitizeStudentId)}
            {field('nameEn', t.analytics_name_en, t.analytics_name_en_ph, sanitizeName)}
            {field('nameZh', t.analytics_name_zh, t.analytics_name_zh_ph, sanitizeName)}
          </div>
          <div className="flex flex-wrap items-center gap-3 mt-5">
            <button onClick={exportCSV} disabled={!infoComplete} className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_csv}</button>
            {!infoComplete && <span className="text-sm text-slate-500">{t.analytics_fill_required}</span>}
            <button onClick={clearAnalytics} className="ml-auto px-4 py-2 rounded-lg bg-red-600 text-white font-bold text-sm">{t.analytics_wp_clear}</button>
          </div>
        </section>
      </div>
    );
  };

  const renderModule = () => module === 0 ? renderM0() : module <= NUM_LEARN ? renderLearn() : module === IDX_LAB ? renderLab() : module === IDX_RES ? renderRes() : renderAna();

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-hidden">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_modules}>{menuOpen ? <IconX/> : <IconMenu/>}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)} className={`w-full flex items-center gap-3 px-4 py-3 text-sm text-left ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 font-bold text-[#004030] dark:text-[#D8C3A5]' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span aria-hidden="true">{m.icon}</span><span className="truncate">{m.nav}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_home}><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="flex items-center gap-1 px-2 py-2 hover:bg-white/10 rounded-lg text-sm" aria-label={t.audio_read}>
              {ttsState === 'playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}<span className="hidden md:inline">{t.audio_read}</span>
            </button>
            {ttsState !== 'idle' && <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.audio_stop}><IconSquare size={18}/></button>}
            <button onClick={() => { try { speechSynthesis.cancel(); } catch {} setTtsState('idle'); setLang(lang === 'en' ? 'zh' : 'en'); }} className="px-2 py-1 rounded-lg border border-[#D8C3A5]/50 text-[#D8C3A5] text-sm font-bold hover:bg-white/10">{lang === 'en' ? '中' : 'EN'}</button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Theme">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex gap-6 px-4 py-6">
        <aside className="hidden md:block w-64 shrink-0">
          <nav className="sticky top-20 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-2 max-h-[calc(100vh-7rem)] overflow-y-auto">
            <p className="px-3 py-2 text-xs font-bold uppercase tracking-wider text-slate-500">{t.nav_modules}</p>
            {modulesList.map(m => (
              <button key={m.id} onClick={() => go(m.id)} className={`w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-left ${module === m.id ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                <span className="shrink-0">{m.id === IDX_LAB ? <IconZapLab size={16}/> : m.id === IDX_RES ? <IconGlobe size={16}/> : m.id === IDX_ANA ? <IconActivity size={16}/> : <span aria-hidden="true">{m.icon}</span>}</span>
                <span className="truncate">{m.nav}</span>
              </button>
            ))}
          </nav>
        </aside>
        <main className="flex-1 min-w-0" onClick={countClick}>
          <div key={module}>{renderModule()}</div>
          <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
            <button onClick={() => go(Math.max(0, module - 1))} disabled={module === 0} className="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 font-bold text-sm disabled:opacity-0">← {t.nav_prev}</button>
            <button onClick={() => go(Math.min(TOTAL - 1, module + 1))} disabled={module === TOTAL - 1} className="px-4 py-2 rounded-lg bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold text-sm disabled:opacity-0">{t.nav_next} →</button>
          </div>
        </main>
      </div>

      <footer className="min-h-8 py-1 bg-[#004030] flex flex-wrap items-center justify-between gap-x-4 px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

if (!window.__BLOCKED__) ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
